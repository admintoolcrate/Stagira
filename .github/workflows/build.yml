name: Build APK

# Kept lean on Actions minutes:
# - a newer push cancels the build still running for the same branch;
# - tests and the debug APK share one Gradle run;
# - the slower release (R8) build and the signed Play bundle only run when asked for:
#   "Run workflow" with "release" ticked, or a pushed tag like v2.1.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Also build the optimised release, and the signed Play bundle if the upload key is set up
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Aristotle quotations against the source text
        run: python3 tools/verify_quotes.py
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stagirites-ledger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # The optimised (R8) build a store release would use; unsigned, so it isn't uploaded.
      - name: Check release build
        if: env.RELEASE == 'true'
        run: ./gradlew assembleRelease

  # The signed bundle for Google Play, once the upload key is added as repository
  # secrets (see docs/play-store/RELEASE.md). Only for release runs.
  play-bundle:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - name: Build signed release bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          name: stagirite-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
