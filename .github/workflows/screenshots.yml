name: Store screenshots

# Draws the Google Play screenshots from the app's real screens (StoreScreenshots.kt) and
# saves them to docs/play-store/screenshots. Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Draw the screenshots
        run: ./gradlew testDebugUnitTest --tests 'com.stagirite.ledger.screenshots.*' -Pscreenshots=true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: store-screenshots
          path: |
            app/build/store-screenshots/
            app/build/reports/tests/
      - name: Save them to the repo
        run: |
          mkdir -p docs/play-store/screenshots
          cp app/build/store-screenshots/*.png docs/play-store/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/play-store/screenshots
          git commit -m "Store screenshots [skip ci]" || echo "No changes"
          git push
